<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ふじゅ〜ペイ | 設定</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">
    <header class="bg-white shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center gap-2">
            <h1 class="text-xl font-bold text-red-600 tracking-wider flex items-center gap-1">
                <span class="bg-red-600 text-white px-2 py-0.5 rounded text-sm font-black">ふじゅ〜</span> ペイ
            </h1>
            <div class="flex gap-2">
                <button id="toMainBtn" class="text-sm text-gray-500 hover:text-gray-700 font-medium">メインへ</button>
                <button id="logoutBtn" class="text-sm text-gray-500 hover:text-red-600 font-medium">ログアウト</button>
            </div>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto px-4 py-6 flex-grow space-y-4">
        <div class="bg-white rounded-2xl shadow-md p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Minecraft連携ステータス</h2>
            <div class="space-y-4">
                <div class="border border-gray-200 rounded-xl p-4">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-sm font-bold text-gray-700">Java版</h3>
                        <span id="javaStatus" class="inline-block text-xs font-bold px-2 py-1 rounded-full bg-amber-100 text-amber-700">未連携</span>
                    </div>
                    <div id="javaDetail"></div>
                </div>
                <div class="border border-gray-200 rounded-xl p-4">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-sm font-bold text-gray-700">統合版</h3>
                        <span id="bedrockStatus" class="inline-block text-xs font-bold px-2 py-1 rounded-full bg-amber-100 text-amber-700">未連携</span>
                    </div>
                    <div id="bedrockDetail"></div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-gray-800">現在の連携アカウント管理</h3>
                <button id="reloadStatusBtn" class="text-xs text-gray-500 hover:text-gray-700">更新</button>
            </div>
            <div id="linkedAccountList" class="space-y-2"></div>
            <p class="text-[11px] text-gray-400 mt-3">※ 連携の追加はメインページの連携コード入力から行えます。</p>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-gray-400">
        &copy; 2026 FJ Economy / clusters-prj.com
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/settings.js"></script>
</body>
</html>
