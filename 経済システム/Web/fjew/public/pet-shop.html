<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ふじゅ〜ペイ | ペットショップ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">
    <header class="fj-header">
        <div class="fj-header__inner">
            <div class="flex items-center gap-2">
                <button id="backBtn" class="fj-back" aria-label="戻る">←</button>
                <h1 class="fj-logo">ペットショップ</h1>
            </div>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto px-4 py-6 flex-grow space-y-4">
        <div class="bg-white rounded-2xl shadow-sm p-4 space-y-2">
            <label class="text-xs font-bold text-gray-500">購入するアカウント</label>
            <select id="buyerSelect" class="w-full border rounded-xl px-3 py-2 text-sm"></select>
        </div>

        <div id="emptyState" class="hidden bg-white rounded-2xl shadow-sm p-8 text-center text-gray-400 text-sm">
            現在販売中のペットはありません
        </div>

        <div id="catalogGrid" class="grid grid-cols-2 gap-3"></div>

        <div id="loadingIndicator" class="text-center text-xs text-gray-400 py-4">読み込み中...</div>

        <div class="bg-white rounded-2xl shadow-sm p-4 text-xs text-gray-500 leading-relaxed">
            購入後、ゲーム内で <code class="bg-gray-100 px-1 rounded">/cmob claim</code> を実行すると
            現在地にペットが受け取れます。
        </div>
    </main>

    <footer class="fj-footer">
        <div class="fj-footer__links">
            <a href="https://web-kaguya.clusters-prj.com" target="_blank" rel="noopener">MCツクヨミコミュニティサイト</a>
            <span class="fj-footer__sep">|</span>
            <a href="https://discord.gg/UXpPWxyq2" target="_blank" rel="noopener">Discord</a>
        </div>
        &copy; 2026 FJ Economy / clusters-prj.com<br>
        これはファンによる非公式サイトであり、公式による許可・賛同を得たものではありません。<br>
        また、表示される通貨は仮想のものであり、現実での取引に使用できるものではありません。
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/pet-shop.js"></script>
</body>
</html>
