<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ふじゅ〜ペイ | 設計図プレビュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">
    <header class="fj-header">
        <div class="fj-header__inner">
            <div class="flex items-center gap-2">
                <button id="backBtn" class="fj-back" aria-label="戻る">←</button>
                <h1 class="fj-logo">設計図プレビュー</h1>
            </div>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto px-4 py-6 flex-grow space-y-4">
        <div id="loadingIndicator" class="text-center text-xs text-gray-400 py-4">読み込み中...</div>
        <div id="errorState" class="hidden bg-white rounded-2xl shadow-md p-6 text-sm text-red-500"></div>

        <div id="previewContent" class="hidden space-y-4">
            <div class="bg-white rounded-2xl shadow-md p-4 space-y-1">
                <h2 id="blueprintName" class="text-lg font-bold text-gray-800"></h2>
                <p id="blueprintStats" class="text-xs text-gray-400"></p>
            </div>
            <div id="previewCanvasWrap" class="bg-white rounded-2xl shadow-md overflow-hidden" style="height: 65vh; touch-action: none;"></div>
            <div class="bg-white rounded-2xl shadow-md p-4 space-y-2">
                <h3 class="text-xs font-bold text-gray-500">ドラッグで回転・ホイールでズーム</h3>
                <div id="materialLegend" class="flex flex-wrap gap-2"></div>
            </div>
        </div>
    </main>

    <footer class="fj-footer">
        <div class="fj-footer__links">
            <a href="https://web-kaguya.clusters-prj.com" target="_blank" rel="noopener">MCツクヨミコミュニティサイト</a>
            <span class="fj-footer__sep">|</span>
            <a href="https://discord.gg/UXpPWxyq2" target="_blank" rel="noopener">Discord</a>
        </div>
        &copy; 2026 FJ Economy / clusters-prj.com<br>
        これはファンによる非公式サイトであり、公式による許可・賛同を得たものではありません。<br>
        また、表示される通貨は仮想のものであり、現実での取引に使用できるものではありません。
    </footer>

    <script src="/js/common.js"></script>
    <script type="module" src="/js/marketplace-preview.js"></script>
</body>
</html>
