<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ふじゅ〜ペイ | パスワード再設定</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">
    <header class="bg-white shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-red-600 tracking-wider flex items-center gap-1">
                <span class="bg-red-600 text-white px-2 py-0.5 rounded text-sm font-black">ふじゅ〜</span> ペイ
            </h1>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto px-4 py-6 flex-grow">
        <div id="resetFormSection" class="hidden bg-white rounded-2xl shadow-md p-6 mt-4">
            <h2 class="text-xl font-bold text-gray-800 mb-6 text-center">新しいパスワードを設定</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">新しいパスワード（8文字以上）</label>
                    <input type="password" id="newPassword" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500" placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">新しいパスワード（確認）</label>
                    <input type="password" id="newPasswordConfirm" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500" placeholder="••••••••">
                </div>
                <button id="submitReset" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl shadow-sm hover:bg-red-700 transition">パスワードを更新する</button>
            </div>
        </div>

        <div id="resetDoneSection" class="hidden bg-white rounded-2xl shadow-md p-6 mt-4 text-center">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">パスワードを更新しました</h2>
            <p class="text-xs text-gray-500 mb-6 leading-relaxed">新しいパスワードでログインしてください。</p>
            <a href="/login" class="block w-full bg-red-600 text-white font-bold py-3 rounded-xl shadow-sm hover:bg-red-700 transition">ログイン画面へ</a>
        </div>

        <div id="resetErrorSection" class="hidden bg-white rounded-2xl shadow-md p-6 mt-4 text-center">
            <h2 class="text-xl font-bold text-gray-800 mb-2">リンクが無効です</h2>
            <p id="resetErrorMessage" class="text-xs text-gray-500 mb-6 leading-relaxed">リンクの有効期限が切れているか、無効なリンクです。</p>
            <a href="/login" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl shadow-sm transition">ログイン画面へ戻る</a>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-gray-400">
        &copy; 2026 FJ Economy / clusters-prj.com
    </footer>

    <script src="/js/common.js" data-cfasync="false"></script>
    <script src="/js/reset-password.js" data-cfasync="false"></script>
</body>
</html>
