<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>FJ Economy RO-API Specification</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        body { margin: 0; background-color: #fafafa; }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        const spec = {
            openapi: "3.0.0",
            info: {
                title: "FJ Economy RO-API",
                description: "FJ Economy サーバーの読み取り専用API仕様書です。",
                version: "1.0.0"
            },
            servers: [{ url: "/" }],
            paths: {
                "/api/economy/balance/{uuid}": {
                    get: {
                        summary: "特定プレイヤーの残高取得",
                        tags: ["Economy"],
                        parameters: [{ name: "uuid", in: "path", required: true, schema: { type: "string" } }],
                        responses: { 200: { description: "成功" }, 404: { description: "未見つかり" } }
                    }
                },
                "/api/economy/ranking": {
                    get: {
                        summary: "長者番付 TOP100",
                        tags: ["Economy"],
                        responses: { 200: { description: "成功" } }
                    }
                },
                "/api/shops": {
                    get: {
                        summary: "ショップ一覧・検索",
                        tags: ["Shops"],
                        parameters: [
                            { name: "item", in: "query", schema: { type: "string" }, description: "アイテム素材名" },
                            { name: "server_id", in: "query", schema: { type: "string" }, description: "サーバーID" }
                        ],
                        responses: { 200: { description: "成功" } }
                    }
                },
                "/api/shops/owner/{uuid}": {
                    get: {
                        summary: "特定店主のショップ一覧",
                        tags: ["Shops"],
                        parameters: [{ name: "uuid", in: "path", required: true, schema: { type: "string" } }],
                        responses: { 200: { description: "成功" } }
                    }
                },
                "/api/transactions": {
                    get: {
                        summary: "全取引履歴（最新100件）",
                        tags: ["Transactions"],
                        responses: { 200: { description: "成功" } }
                    }
                },
                "/api/transactions/player/{uuid}": {
                    get: {
                        summary: "プレイヤー関連の取引履歴",
                        tags: ["Transactions"],
                        parameters: [{ name: "uuid", in: "path", required: true, schema: { type: "string" } }],
                        responses: { 200: { description: "成功" } }
                    }
                },
                "/api/analytics/shop/{uuid}": {
                    get: {
                        summary: "店主の売上統計（過去30日）",
                        tags: ["Analytics"],
                        parameters: [{ name: "uuid", in: "path", required: true, schema: { type: "string" } }],
                        responses: { 200: { description: "成功" } }
                    }
                },
                "/api/admin/economy/summary": {
                    get: {
                        summary: "経済指標サマリー",
                        tags: ["Admin"],
                        responses: { 200: { description: "成功" } }
                    }
                },
                "/api/admin/government/ledger": {
                    get: {
                        summary: "政府収支台帳",
                        tags: ["Admin"],
                        responses: { 200: { description: "成功" } }
                    }
                }
            }
        };

        window.onload = () => {
            window.ui = SwaggerUIBundle({
                spec: spec,
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [SwaggerUIBundle.presets.apis],
                layout: "BaseLayout"
            });
        };
    </script>
</body>
</html>
