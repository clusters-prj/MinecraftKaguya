name: FJEconomy
version: 2.0.1
description: Integrated economy system for Paper servers with database sync
author: Clusters-PRJ
website: https://www.clusters-prj.com
api-version: '26.1.2'

main: com.clustersprj.fjeconomy.FJEconomy

# CoreProtect: 建築量ポイントの集計に使用（未導入でも起動はする）
# CoreProtect より後に読み込まれるようにする。
# フォーク版は plugin.yml の name が異なる（customProtect 等）ため、
# 実際に使われている名前も併記しないと読み込み順が保証されない。
# 名前が一致しない場合でも BuildRewardManager が後から API を取得し直すので
# 致命的にはならないが、起動直後の定期集計を取りこぼさないためここに追加する。
softdepend: [CoreProtect, customProtect]

# Suppress Nag about System.out/err usage in dependencies
suppress-nag:
  - use-of-base-classes

commands:
  fj:
    description: FJ Economy command
    usage: /fj <subcommand> [args]
    aliases: [economy, fje]
  
  fjeadmin:
    description: FJ Economy admin commands
    usage: /fjeadmin <subcommand> [args]

  shop:
    description: Shop management commands
    usage: /shop <subcommand> [args]
    aliases: [s]

  fjegovernment:
    description: Government account management commands
    usage: /fjegovernment <subcommand> [args]
    aliases: [fjegov, gov]

permissions:
  fj.use:
    description: Use FJ Economy commands
    default: false
  
  fj.pay:
    description: Send money to other players
    default: false
  
  fj.admin:
    description: Admin commands for FJ Economy
    default: false
  
  fj.reload:
    description: Reload FJ Economy config
    default: false

  fj.shop.create:
    description: Create a shop
    default: false

  fj.shop.delete:
    description: Delete a shop
    default: false

  fj.shop.manage:
    description: Manage shops (price, stock)
    default: false

  fj.government:
    description: Government account management
    default: false
    children:
      fj.government.set: false

  fj.government.set:
    description: Set government balance directly (dangerous)
    default: false

  fj.arena.bypass:
    description: Allowed to enter arena zones even when not a registered participant
    default: op
