# FJ Economy Plugin Configuration

# Database settings
database:
  # Connection URL
  url: "jdbc:mariadb://10.2.1.27:3306/fjeconomy?characterEncoding=utf8mb4&serverTimezone=Asia/Tokyo"
  username: "fjeconomy"
  password: "your_password_here"
  
  # Connection pool settings
  pool_size: 10
  max_lifetime: 1800000  # 30 minutes in milliseconds

# Server identification
server:
  # Server ID (mc1, mc2, mc3)
  id: "mc1"
  # Server name for display
  name: "Main Server"

# Currency settings
currency:
  # Currency symbol
  symbol: "¥"
  # Currency name
  name: "FJ Credits"
  # Decimal places (0 = integer only)
  decimal_places: 0

# Tax and fees
economy:
  # Tax rate on shop transactions (percentage, e.g., 10 = 10%)
  tax_rate: 10.0
  # Rounding method: "HALF_UP" or "DOWN"
  rounding_method: "HALF_UP"
  # Initial balance for new players
  starting_balance: 1000
  # Allow negative balances (debt)
  allow_negative: false

# Shop system
shop:
  # Default shop stock (per item)
  default_stock: 100
  # Enable shop price updates from web
  sync_prices: true
  # Sync interval in seconds
  sync_interval: 300

# Government account
government:
  # Government account UUID
  uuid: "00000000-0000-0000-0000-000000000001"
  # Government account name
  name: "GOVERNMENT"

# Web API settings
web_api:
  # Enable web API endpoints
  enabled: true
  # API base URL
  base_url: "https://clusters-prj.com/api/economy"
  # API token (change this!)
  token: "your_api_token_here"

# Logging
logging:
  # Log level: DEBUG, INFO, WARN, ERROR
  level: "INFO"
  # Log file location
  file: "plugins/FJEconomy/logs/economy.log"
  # Log transactions
  log_transactions: true

# Messages
messages:
  prefix: "<gray>[<aqua>ふじゅ～ペイシステム<gray>] "
  
  # Command messages
  balance_format: "{player} の残高: {symbol}{balance}"
  balance_insufficient: "&c残高不足です"
  payment_success: "&a{amount}{symbol} を {receiver} に送金しました"
  payment_received: "&a{sender} から {amount}{symbol} を受け取りました"
  
  # Shop messages
  purchase_success: "&a{item}を{amount}個購入しました（支払額: {symbol}{total}）"
  purchase_failed: "&c購入に失敗しました: {reason}"
  shop_info: "&b{npc}の店&r - {item}: {symbol}{price}（在庫: {stock}個）"
  
  # Admin messages
  give_success: "&a{player} に {amount}{symbol} を付与しました"
  take_success: "&a{player} から {amount}{symbol} を没収しました"
  set_success: "&a{player} の残高を {amount}{symbol} に設定しました"
  
  # Error messages
  player_not_found: "&cプレイヤーが見つかりません: {player}"
  database_error: "&cデータベースエラー: {error}"
  invalid_amount: "&c無効な金額です"
  reload_success: "&aFJ Economy をリロードしました"
  reload_failed: "&cリロードに失敗しました: {error}"

# ログインボーナス設定
login_bonus:
  enabled: true
  amount: 500
  cooldown_hours: 24
