name: Migrate Reposilite layout (one-off)

# 旧レイアウトのファイルを新レイアウトへ移す、一回限りの手動ワークフロー。
#   新: /snapshots/<プラグイン名>/<ブランチ名>/<バージョン>/<ファイル>
# 手順: コピー -> 内容 (SHA-256) が一致することを確認 -> 旧ファイルを削除
# 対象は、CI が出力した形式のファイルだけ。それ以外 (手動アップロードしたリリースなど) は触らず、一覧に表示するだけ。
#   (a) /releases/<プラグイン名>/<バージョン>/ の …-b<N>.jar と …-latest.jar
#       (旧 CI は全てのビルドを /releases に置いていた。バージョンが -SNAPSHOT でなくても、
#        <プラグイン名>-<バージョン>.jar (リリース) や <プラグイン名>-latest.jar は対象外)
#   (b) /releases/<プラグイン名>/<バージョン>-b<N>/ (ビルドごとにフォルダが分かれていた、旧い形)
#       ファイル名の二重の -b<N>-b<N> を直して、(a) と同じ場所へ移す。
#       フォルダ内の …-b<N>-latest.jar は、同じビルドの jar と内容が同じ重複なので、確認のうえ削除する
#   (c) /snapshots/<プラグイン名>/<バージョン>/ (WEGuardBridge の旧配置)
#
# まず dry_run=true (既定) で実行して、ログの計画を確認してから dry_run=false で実行する。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: 計画を表示するだけで何も変更しない / false: 実際に移動する"
        type: boolean
        default: true
      branch:
        description: "移行先のブランチ名 (旧ファイルは全て main のビルドだったため main)"
        type: string
        default: main
      cleanup_empty_dirs:
        description: "true: 移動のあとに、中身が空になったフォルダも削除する (空であることを確認できたフォルダだけ)"
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      REPO_USER: ${{ secrets.REPOSILITE_USER }}
      REPO_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
      REPO_BASE_URL: "https://reposilite.clusters-prj.com"
      DRY_RUN: ${{ inputs.dry_run }}
      BRANCH: ${{ inputs.branch }}
      CLEANUP_EMPTY_DIRS: ${{ inputs.cleanup_empty_dirs }}
    steps:
      - name: Migrate
        shell: python3 {0}
        run: |
          import base64, hashlib, json, os, re, sys, urllib.error, urllib.request

          BASE = os.environ["REPO_BASE_URL"].rstrip("/")
          DRY = os.environ["DRY_RUN"].lower() == "true"
          BRANCH = re.sub(r"[^A-Za-z0-9._-]", "_", os.environ["BRANCH"].replace("/", "-"))
          AUTH = "Basic " + base64.b64encode(f"{os.environ['REPO_USER']}:{os.environ['REPO_TOKEN']}".encode()).decode()

          def req(method, url, data=None):
              # Cloudflare は既定の Python-urllib の User-Agent を弾く (403 error code: 1010) ので、明示する
              r = urllib.request.Request(url, data=data, method=method,
                                         headers={"Authorization": AUTH, "User-Agent": "MinecraftKaguya-reposilite-migrate/1.0 (GitHub Actions)"})
              try:
                  with urllib.request.urlopen(r, timeout=120) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def listing(path):
              """path 直下の (ディレクトリ名のリスト, ファイル名のリスト)。無ければ ([], [])"""
              status, body = req("GET", f"{BASE}/api/maven/details/{path}")
              if status == 404:
                  return [], []
              if status != 200:
                  sys.exit(f"::error::一覧を取得できません: {path} (HTTP {status}) {body[:200]!r}")
              doc = json.loads(body)
              if doc.get("type") != "DIRECTORY" or "files" not in doc:
                  sys.exit(f"::error::想定外の応答です: {path}: {str(doc)[:200]}")
              dirs = sorted(f["name"] for f in doc["files"] if f["type"] == "DIRECTORY")
              files = sorted(f["name"] for f in doc["files"] if f["type"] == "FILE")
              return dirs, files

          def new_name(plugin, version, name):
              """CI が出力した形式なら新しいファイル名を返す。そうでなければ None
              (<プラグイン名>-<バージョン>.jar や <プラグイン名>-latest.jar は CI 形式ではないので対象外)"""
              if name == f"{plugin}-{version}-latest.jar":
                  return name
              if re.fullmatch(re.escape(f"{plugin}-{version}") + r"-b\d+\.jar", name):
                  return name
              # WEGuardBridge の旧名: <plugin>-1.0.0-b<N>-SNAPSHOT.jar -> <plugin>-1.0.0-SNAPSHOT-b<N>.jar
              m = re.fullmatch(re.escape(plugin) + r"-(.+)-b(\d+)-SNAPSHOT\.jar", name)
              if m and version == f"{m.group(1)}-SNAPSHOT":
                  return f"{plugin}-{version}-b{m.group(2)}.jar"
              return None

          # plan: dict(src, dst, kind)   kind: "move" (コピー→確認→旧を削除) / "dup" (重複。twin と同じ内容なら削除するだけ)
          plan, skipped = [], []

          # (a)(b) 旧: /releases/<plugin>/<version>/<file>
          for plugin in listing("releases")[0]:
              for version in listing(f"releases/{plugin}")[0]:
                  files = listing(f"releases/{plugin}/{version}")[1]
                  odd = re.fullmatch(r"(.+)-b(\d+)", version)   # 例: 1.0.0-SNAPSHOT-b188 (ビルドごとのフォルダ)
                  for name in files:
                      src = f"releases/{plugin}/{version}/{name}"
                      if odd and odd.group(1).endswith("-SNAPSHOT"):
                          base, n = odd.group(1), odd.group(2)
                          if name == f"{plugin}-{version}-b{n}.jar":
                              dst = f"snapshots/{plugin}/{BRANCH}/{base}/{plugin}-{base}-b{n}.jar"
                              plan.append(dict(src=src, dst=dst, kind="move"))
                              continue
                          if name == f"{plugin}-{version}-latest.jar":
                              twin = f"releases/{plugin}/{version}/{plugin}-{version}-b{n}.jar"
                              if twin.rsplit("/", 1)[1] in files:
                                  plan.append(dict(src=src, dst=f"snapshots/{plugin}/{BRANCH}/{base}/{plugin}-{base}-b{n}.jar",
                                                   kind="dup", twin=twin))
                                  continue
                          skipped.append(src)
                          continue
                      nn = new_name(plugin, version, name)
                      if nn:
                          plan.append(dict(src=src, dst=f"snapshots/{plugin}/{BRANCH}/{version}/{nn}", kind="move"))
                      else:
                          skipped.append(src)

          # (c) 旧: /snapshots/<plugin>/<version>/<file> (ファイルが直下にあるものだけ。新レイアウトのブランチ階層は対象外)
          for plugin in listing("snapshots")[0]:
              for version in listing(f"snapshots/{plugin}")[0]:
                  for name in listing(f"snapshots/{plugin}/{version}")[1]:
                      src = f"snapshots/{plugin}/{version}/{name}"
                      nn = new_name(plugin, version, name)
                      if nn:
                          plan.append(dict(src=src, dst=f"snapshots/{plugin}/{BRANCH}/{version}/{nn}", kind="move"))
                      else:
                          skipped.append(src)

          print(f"=== 移動の計画 ({'ドライラン: 何も変更しません' if DRY else '実行'}) : {len(plan)} 件 ===")
          for it in plan:
              if it["kind"] == "dup":
                  print(f"  {it['src']}\n    -> (重複のため削除のみ。{it['twin']} と同じ内容か確認する)")
              else:
                  print(f"  {it['src']}\n    -> {it['dst']}")
          print(f"=== 対象外 (CI 形式ではないため触りません) : {len(skipped)} 件 ===")
          for sk in skipped:
              print(f"  {sk}")

          CLEANUP = os.environ.get("CLEANUP_EMPTY_DIRS", "false").lower() == "true"

          def get_dir(path):
              """path が空でないか確認するための一覧。ディレクトリの中身 (リスト) を返す。無い・ディレクトリでないなら None"""
              st, body = req("GET", f"{BASE}/api/maven/details/{path}")
              if st != 200:
                  return None
              doc = json.loads(body)
              if doc.get("type") != "DIRECTORY":
                  return None
              return doc.get("files", [])

          def empty_dirs():
              """中身が空のフォルダを返す: <リポジトリ>/<プラグイン名>/<バージョン> と、子が全て空の <リポジトリ>/<プラグイン名>"""
              found = []
              for repo in ("releases", "snapshots"):
                  for plugin in listing(repo)[0]:
                      children = get_dir(f"{repo}/{plugin}") or []
                      vers = [c["name"] for c in children if c["type"] == "DIRECTORY"]
                      others = [c for c in children if c["type"] != "DIRECTORY"]
                      empties = [v for v in vers if get_dir(f"{repo}/{plugin}/{v}") == []]
                      found += [f"{repo}/{plugin}/{v}" for v in empties]
                      if children and not others and len(empties) == len(vers):
                          found.append(f"{repo}/{plugin}")   # 子が全て空 = このフォルダも空になる
              return found

          if DRY:
              if CLEANUP:
                  ed = empty_dirs()
                  print(f"\n=== 削除する空のフォルダ (ドライラン: 何も変更しません) : {len(ed)} 件 ===")
                  for d in ed:
                      print(f"  {d}/")
              print("\nドライランです。内容を確認して、問題なければ dry_run=false で再実行してください。")
              sys.exit(0)

          failed = 0
          for it in plan:
              src, dst = it["src"], it["dst"]
              try:
                  status, data = req("GET", f"{BASE}/{src}")
                  if status != 200:
                      raise RuntimeError(f"取得できません (HTTP {status})")
                  digest = hashlib.sha256(data).hexdigest()

                  if it["kind"] == "dup":
                      # 同じビルドの jar (移行済み) と内容が同じことを確認してから、削除だけする
                      st, twin_data = req("GET", f"{BASE}/{dst}")
                      if st != 200 or hashlib.sha256(twin_data).hexdigest() != digest:
                          raise RuntimeError(f"移行先の {dst} と内容が一致しないため、削除しません")
                      print(f"重複を確認 (内容一致): {src}")
                  else:
                      st, existing = req("GET", f"{BASE}/{dst}")
                      if st == 200:
                          if hashlib.sha256(existing).hexdigest() == digest:
                              print(f"既にコピー済み (内容一致): {dst}")
                          elif dst.endswith("-latest.jar"):
                              print(f"移行先に新しい -latest.jar があるためコピーしません (旧は削除): {dst}")
                          else:
                              raise RuntimeError("移行先に内容が異なる同名ファイルがあります。旧は残します")
                      else:
                          st, body = req("PUT", f"{BASE}/{dst}", data)
                          if not 200 <= st < 300:
                              raise RuntimeError(f"コピーに失敗 (HTTP {st}) {body[:200]!r}")
                          st, copied = req("GET", f"{BASE}/{dst}")
                          if st != 200 or hashlib.sha256(copied).hexdigest() != digest:
                              raise RuntimeError("コピー後の内容が一致しません。旧は残します")
                          print(f"コピーして確認: {dst}")

                  st, body = req("DELETE", f"{BASE}/{src}")
                  if not (200 <= st < 300 or st == 404):
                      raise RuntimeError(f"旧ファイルの削除に失敗 (HTTP {st}) {body[:200]!r}")
                  print(f"旧を削除: {src}")
              except Exception as e:
                  failed += 1
                  print(f"::error::{src}: {e}")

          print(f"\n完了: 成功 {len(plan) - failed} 件 / 失敗 {failed} 件")

          if CLEANUP:
              print("\n=== 空のフォルダの削除 ===")
              removed = 0
              # 子フォルダ -> 親フォルダの順に処理するため、深いものから (パスが長い順)
              for d in sorted(empty_dirs(), key=lambda x: -x.count("/")):
                  cur = get_dir(d)          # 削除の直前に、もう一度、空であることを確認する
                  if cur is None:
                      print(f"既に無いためスキップ: {d}/")
                      continue
                  if cur != []:
                      print(f"空ではなくなったためスキップ: {d}/")
                      continue
                  st, body = req("DELETE", f"{BASE}/{d}")
                  if 200 <= st < 300 or st == 404:
                      removed += 1
                      print(f"空のフォルダを削除: {d}/")
                  else:
                      print(f"::warning::空のフォルダを削除できません: {d}/ (HTTP {st}) {body[:200]!r}")
              print(f"空のフォルダを {removed} 件削除しました")

          sys.exit(1 if failed else 0)
