name: Java Code Quality Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    # ログをファイル(maven.log)に保存
    - name: Run Quality Checks
      run: mvn clean verify 2>&1 | tee maven.log

    # 1通目：全体のステータス（成功・失敗）を通知
    - name: Discord Status Notification
      if: always()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ job.status }}
        username: "GitHub Actions (Quality Check)"

    # ログを重要度（ERROR/WARNING）別に抽出
    - name: Extract and Categorize Logs
      if: always()
      run: |
        grep "\[ERROR\]" maven.log > errors.txt || true && grep "\[WARNING\]" maven.log > warnings.txt || true

    # ログファイルが空でなければ、それぞれファイルとしてDiscordへ送信
    - name: Upload Log Files to Discord
      if: always()
      run: |
        if [ -s errors.txt ]; then curl -F "content=❌ **Maven Errors**" -F "file=@errors.txt" "${{ secrets.DISCORD_WEBHOOK }}"; fi && if [ -s warnings.txt ]; then curl -F "content=⚠️ **Maven Warnings**" -F "file=@warnings.txt" "${{ secrets.DISCORD_WEBHOOK }}"; fi