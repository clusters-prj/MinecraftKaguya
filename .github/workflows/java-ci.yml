name: Java Code Quality Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    # ログをファイル(maven.log)に保存
    - name: Run Quality Checks
      run: mvn clean verify 2>&1 | tee maven.log

    # 1通目：全体のステータス（成功・失敗）を通知
    - name: Discord Status Notification
      if: always()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ job.status }}
        username: "GitHub Actions (Quality Check)"

    # ログを重要度（High / Medium / Low / その他）別に抽出
    - name: Extract and Categorize Logs
      if: always()
      run: |
        grep "High:" maven.log > high.txt || true && grep "Medium:" maven.log > medium.txt || true && grep "Low:" maven.log > low.txt || true && grep -E "\[ERROR\]|\[WARNING\]" maven.log | grep -v -E "High:|Medium:|Low:" > other_errors.txt || true

    # 各ログファイルに中身があれば、それぞれファイルとしてDiscordへ送信
    - name: Upload Log Files to Discord
      if: always()
      run: |
        if [ -s high.txt ]; then curl -F "content=🔴 **High Severity**" -F "file=@high.txt" "${{ secrets.DISCORD_WEBHOOK }}"; fi && if [ -s medium.txt ]; then curl -F "content=🟡 **Medium Severity**" -F "file=@medium.txt" "${{ secrets.DISCORD_WEBHOOK }}"; fi && if [ -s low.txt ]; then curl -F "content=🔵 **Low Severity**" -F "file=@low.txt" "${{ secrets.DISCORD_WEBHOOK }}"; fi && if [ -s other_errors.txt ]; then curl -F "content=📁 **Other Build Errors/Warnings**" -F "file=@other_errors.txt" "${{ secrets.DISCORD_WEBHOOK }}"; fi
