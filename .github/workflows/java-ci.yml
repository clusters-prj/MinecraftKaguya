name: Java Code Quality Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    # ログをファイル(maven.log)に保存
    - name: Run Quality Checks
      run: mvn clean verify 2>&1 | tee maven.log

    # 1通目：全体のステータス（成功・失敗）を通知
    - name: Discord Status Notification
      if: always()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ job.status }}
        username: "GitHub Actions (Quality Check)"

    # 2通目以降：エラー・警告ログを抽出して1800文字ごとに分割
    - name: Extract and Split Logs
      if: always()
      run: |
        grep -E "\[ERROR\]|\[WARNING\]" maven.log > filtered.log || true
        if [ -s filtered.log ]; then
          split -C 1800 -d filtered.log chunk_
        fi

    # 分割されたログを順番にDiscordへ連投（エラーがなければスキップ）
    - name: Post Log Chunks to Discord
      if: always()
      run: |
        for f in chunk_*; do
          if [ -f "$f" ]; then
            payload_content=$(cat "$f")
            jq -n --arg msg "\`\`\`text"$'\n'"$payload_content"$'\n'"\`\`\`" '{"content": $msg}' > payload.json
            curl -H "Content-Type: application/json" -X POST -d @payload.json "${{ secrets.DISCORD_WEBHOOK }}"
            rm -f payload.json
          fi
        done