name: Paper Plugins Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Find all pom.xml, Update Version, and Build
        run: find . -name pom.xml | while read -r pom; do pom_dir=$(dirname "$pom") && cd "$pom_dir" && current_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout) && mvn versions:set -DnewVersion="${current_version}-b${{ github.run_number }}" && mvn clean package && cd - > /dev/null; done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-plugins-build-${{ github.run_number }}
          path: "**/target/*.jar"
