name: Paper Plugins Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリースを自動作成・更新するために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # ビルド番号を23番からスタートするための計算ステップ
      - name: Calculate Build Number
        id: build_num
        run: |
          # 23番から始めたい場合、現在のrun_number（1と仮定）に22を足す
          OFFSET=22
          NUMBER=$(( ${{ github.run_number }} + OFFSET ))
          echo "num=$NUMBER" >> $GITHUB_OUTPUT

      # 親pom経由で、各プラグイン固有の現行バージョンに「-b23」などのビルド番号を個別に付与
      - name: Update Version
        run: |
          BUILD_NUM=${{ steps.build_num.outputs.num }}
          mvn versions:set -DnewVersion='${project.version}-b'"$BUILD_NUM"

      # 全モジュールを一括でクリーン＆パッケージング
      - name: Build All Plugins
        run: mvn clean package

      # 各子モジュールのtargetから成果物（jar）を1箇所に集める（findで深く掘り下げてコピー）
      - name: Collect Artifacts
        run: |
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DIST_DIR"
          find . -mindepth 2 -path "*/target/*.jar" ! -name "original-*.jar" -exec cp {} "$DIST_DIR/" \;

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' # mainブランチへの反映時のみリリースを更新
        with:
          tag_name: "latest"
          name: "Development Build"
          body: |
            Automated development build.
            Build Number: b${{ steps.build_num.outputs.num }}
            Commit: ${{ github.sha }}
          prerelease: true
          files: "dist/*.jar"
