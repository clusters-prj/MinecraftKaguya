name: Paper Plugins Build

# スナップショット: main を含む全ブランチへの push
#   -> /snapshots/<プラグイン名>/<ブランチ名>/<バージョン(ビルド番号なし)>/
# リリース: <プラグイン名>-v<バージョン> のタグを作ったときだけ (例: fj-economy-v2.0.1)
#   -> /releases/<プラグイン名>/<バージョン>/
on:
  push:
    branches: [ "**" ]
    tags: [ "*-v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # 通常のビルド: 各 pom のバージョンの後ろに -b<run_number> を付けてビルドする
      # タグのビルド: タグ名 (<artifactId>-v<version>) の対象モジュールだけ、バージョンをタグの値にする
      - name: Update Version and Build
        run: |
          set -euo pipefail
          ROOT_DIR=$(pwd)
          RELEASE_ARTIFACT=""
          RELEASE_VERSION=""

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^(.+)-v([0-9][0-9A-Za-z._-]*)$ ]]; then
              RELEASE_ARTIFACT="${BASH_REMATCH[1]}"
              RELEASE_VERSION="${BASH_REMATCH[2]}"
            else
              echo "::error::タグ名は <プラグイン名>-v<バージョン> の形式にしてください (例: fj-economy-v2.0.1): $GITHUB_REF_NAME"
              exit 1
            fi
            # deploy ステップに引き継ぐ
            echo "RELEASE_ARTIFACT=$RELEASE_ARTIFACT" >> "$GITHUB_ENV"
            echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          fi

          MATCHED=0
          mapfile -t POMS < <(find . -name pom.xml)
          for pom in "${POMS[@]}"; do
            cd "$ROOT_DIR/$(dirname "$pom")"
            ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
            CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            if [ -n "$RELEASE_ARTIFACT" ] && [ "$ARTIFACT_ID" = "$RELEASE_ARTIFACT" ]; then
              NEW_VER="$RELEASE_VERSION"
              MATCHED=1
            else
              NEW_VER="${CURRENT_VERSION}-b${GITHUB_RUN_NUMBER}"
            fi
            mvn -B versions:set -DnewVersion="$NEW_VER"
          done

          if [ -n "$RELEASE_ARTIFACT" ] && [ "$MATCHED" -eq 0 ]; then
            echo "::error::タグ $GITHUB_REF_NAME に対応するモジュール (artifactId=$RELEASE_ARTIFACT) が見つかりません"
            exit 1
          fi

          cd "$ROOT_DIR"
          mvn -B clean package

      # Reposilite へデプロイ (push のときだけ。PR ではビルドのみ)
      # - 1 つでもアップロードに失敗したらこのステップを失敗させる
      #   (以前は curl -s だけで、認証エラー(401)や上書き拒否(409)が握りつぶされていた)
      # - Reposilite は同名ファイルの上書きを拒否する (409) ため、
      #   <artifactId>-<バージョン>-latest.jar は一度削除してから置き直す
      # - スナップショットとリリースの判定は、バージョン文字列ではなく
      #   「ブランチの push か、タグの push か」で行う
      - name: Deploy Artifacts to Reposilite
        if: github.event_name == 'push'
        env:
          REPO_USER: ${{ secrets.REPOSILITE_USER }}
          REPO_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
          REPO_BASE_URL: "https://reposilite.clusters-prj.com" # 末尾のリポジトリ名は除いたベースURL
        run: |
          set -euo pipefail
          ROOT_DIR=$(pwd)
          DEPLOYED=0

          # HTTP ステータスコードだけを返す (接続できない場合は 000)
          http_code() { curl -s -o /dev/null -w '%{http_code}' -u "$REPO_USER:$REPO_TOKEN" "$@"; }

          # upload <ローカルファイル> <URL> [409 を許容するなら allow-conflict]
          upload() {
            local code
            code=$(http_code -X PUT "$2" --upload-file "$1")
            case "$code" in
              2??) return 0 ;;
              409)
                if [ "${3:-}" = "allow-conflict" ]; then
                  echo "::warning::$2 は既に存在します (同じビルドの再実行?)。スキップします"
                  return 0
                fi ;;
            esac
            echo "::error::アップロードに失敗しました: PUT $2 (HTTP $code)"
            return 1
          }

          # ブランチ名をパスに使える形にする (/ は - に、それ以外の記号は _ に)
          SAFE_BRANCH=$(echo "$GITHUB_REF_NAME" | sed -E 's#/#-#g; s#[^A-Za-z0-9._-]#_#g')

          mapfile -t POMS < <(find . -mindepth 2 -name pom.xml)
          for pom in "${POMS[@]}"; do
            pom_dir=$(dirname "$pom")
            cd "$ROOT_DIR/$pom_dir"
            ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
            FULL_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            JAR_FILE="target/${ARTIFACT_ID}-${FULL_VERSION}.jar"

            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              # ---- リリース: タグの対象モジュールだけ ----
              [ "$ARTIFACT_ID" = "${RELEASE_ARTIFACT:-}" ] || continue
              [ -f "$JAR_FILE" ] || { echo "::error::$JAR_FILE が見つかりません"; exit 1; }
              URL="$REPO_BASE_URL/releases/$ARTIFACT_ID/$FULL_VERSION/${ARTIFACT_ID}-${FULL_VERSION}.jar"
              echo "Uploading $JAR_FILE to releases/$ARTIFACT_ID/$FULL_VERSION/ ..."
              upload "$JAR_FILE" "$URL"
              echo "Released: $URL"
            else
              # ---- スナップショット: ブランチごと ----
              BASE_VERSION="${FULL_VERSION%-b${GITHUB_RUN_NUMBER}}"   # ビルド番号を除いたバージョン
              if [ "$BASE_VERSION" = "$FULL_VERSION" ]; then
                echo "::error::$pom_dir: バージョン $FULL_VERSION の末尾に -b${GITHUB_RUN_NUMBER} がありません"
                exit 1
              fi
              if [ ! -f "$JAR_FILE" ]; then
                echo "::warning::$pom_dir: $JAR_FILE が無いためスキップします"
                continue
              fi

              BASE_URL="$REPO_BASE_URL/snapshots/$ARTIFACT_ID/$SAFE_BRANCH/$BASE_VERSION"
              LATEST_URL="$BASE_URL/${ARTIFACT_ID}-${BASE_VERSION}-latest.jar"

              echo "Uploading $JAR_FILE to snapshots/$ARTIFACT_ID/$SAFE_BRANCH/$BASE_VERSION/ ..."
              upload "$JAR_FILE" "$BASE_URL/${ARTIFACT_ID}-${FULL_VERSION}.jar" allow-conflict

              # -latest.jar は先に削除する (まだ無い場合の 404 は問題ない)
              code=$(http_code -X DELETE "$LATEST_URL")
              case "$code" in
                2??|404) ;;
                *) echo "::error::-latest.jar の削除に失敗しました: DELETE $LATEST_URL (HTTP $code)"; exit 1 ;;
              esac
              upload "$JAR_FILE" "$LATEST_URL"

              # 反映されたことを確認する
              code=$(http_code "$LATEST_URL")
              if [ "$code" != "200" ]; then
                echo "::error::アップロード後に $LATEST_URL を取得できません (HTTP $code)"
                exit 1
              fi
              echo "Deployed: $LATEST_URL"
            fi
            DEPLOYED=$((DEPLOYED + 1))
          done

          if [ "$DEPLOYED" -eq 0 ]; then
            echo "::error::デプロイされた jar が 1 つもありません"
            exit 1
          fi
