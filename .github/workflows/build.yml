name: Paper Plugins Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. リポジトリ内のすべての pom.xml を検出するジョブ
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find all pom.xml directories
        id: set-matrix
        run: |
          DIRS=$(find . -name pom.xml -exec dirname {} \; | jq -R . | jq -s -c .)
          echo "matrix=${DIRS}" >> $GITHUB_OUTPUT

  # 2. 検出したプラグインごとに並列でビルドして個別にアップロードするジョブ
  build:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false # 1つのプラグインがエラーになっても、他のビルドを中断しない

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Update Version and Build
        id: maven-build
        run: |
          cd "${{ matrix.directory }}"
          # pom.xmlからartifactId（プラグイン名）を取得して後続ステップで使えるようにする
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          echo "artifact_id=${ARTIFACT_ID}" >> $GITHUB_OUTPUT
          
          # 現行バージョンを取得してビルド番号を付与
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          mvn versions:set -DnewVersion="${CURRENT_VERSION}-b${{ github.run_number }}"
          
          # ビルド実行
          mvn clean package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.maven-build.outputs.artifact_id }}-b${{ github.run_number }}"
          path: "${{ matrix.directory }}/target/*.jar"
