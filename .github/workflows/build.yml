name: Paper Plugins Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Update Version and Deploy via Maven
        if: github.ref == 'refs/heads/main'
        env:
          REPO_USER: ${{ secrets.REPOSILITE_USER }}
          REPO_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
          REPO_URL: "https://reposilite.clusters-prj.com/releases" # releasesリポジトリのURL
        run: |
          DIST_DIR="$GITHUB_WORKSPACE/dist" && mkdir -p "$DIST_DIR" && ROOT_DIR=$(pwd) && find . -name pom.xml | while read -r pom; do pom_dir=$(dirname "$pom") && cd "$ROOT_DIR/$pom_dir" && CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout) && mvn versions:set -DnewVersion="${CURRENT_VERSION}-b${{ github.run_number }}"; done && cd "$ROOT_DIR" && mkdir -p ~/.m2 && echo "<settings><servers><server><id>reposilite</id><username>${REPO_USER}</username><password>${REPO_TOKEN}</password></server></servers></settings>" > ~/.m2/settings.xml && mvn -B deploy -DaltDeploymentRepository=reposilite::default::${REPO_URL} -DskipTests
