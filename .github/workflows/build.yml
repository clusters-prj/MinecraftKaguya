name: Paper Plugins Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリースを自動作成・更新するために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Update Version and Build via Parent POM
        run: |
          DIST_DIR="$GITHUB_WORKSPACE/dist" && mkdir -p "$DIST_DIR"
          ROOT_DIR=$(pwd)
          
          # 1. 各pom.xmlを回ってバージョン更新のみを行う（ここではビルドしない）
          find . -name pom.xml | while read -r pom; do
            pom_dir=$(dirname "$pom") && cd "$ROOT_DIR/$pom_dir"
            CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            mvn versions:set -DnewVersion="${CURRENT_VERSION}-b${{ github.run_number }}"
          done
          
          # 2. 親POM（ルート）に戻って一括でクリーンパッケージを実行
          cd "$ROOT_DIR" && mvn -B clean package
          
          # 3. 各子モジュールのtargetから完成版jarをdistフォルダに集める
          find . -mindepth 2 -path "*/target/*.jar" ! -name "original-*.jar" ! -path "*/target/archive-tmp/*" -exec cp {} "$DIST_DIR/" \;

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' # mainブランチへの反映時のみリリースを更新
        with:
          tag_name: "latest"
          name: "Development Build"
          body: |
            Automated development build.
            Build Number: b${{ github.run_number }}
            Commit: ${{ github.sha }}
          prerelease: true
          files: "dist/*.jar"
