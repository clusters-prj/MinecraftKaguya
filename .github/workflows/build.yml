name: Paper Plugins Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリースを自動作成・更新するために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Find all pom.xml, Update Version, and Build
        run: |
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DIST_DIR"
          ROOT_DIR=$(pwd)
          
          # すべてのpom.xmlを探してループ処理
          find . -name pom.xml | while read -r pom; do
            pom_dir=$(dirname "$pom")
            cd "$ROOT_DIR/$pom_dir"
            
            # 現行バージョンを取得してビルド番号を付与
            CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            mvn versions:set -DnewVersion="${CURRENT_VERSION}-b${{ github.run_number }}"
            
            # ビルド実行
            mvn clean package
            
            # 生成された完成版jar（original-等を除外）をdistフォルダにコピーして集める
            find target -maxdepth 1 -name "*.jar" ! -name "original-*.jar" -exec cp {} "$DIST_DIR/" \;
          done

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' # mainブランチへの反映時のみリリースを更新
        with:
          tag_name: "latest"
          name: "Development Build"
          body: |
            Automated development build.
            Build Number: b${{ github.run_number }}
            Commit: ${{ github.sha }}
          prerelease: true
          files: "dist/*.jar"