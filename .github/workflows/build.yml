name: Paper Plugins Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # -SNAPSHOT があれば -bXX-SNAPSHOT、無ければ -bXX を付与してビルド
      - name: Update Version and Build
        run: |
          ROOT_DIR=$(pwd) && find . -name pom.xml | while read -r pom; do pom_dir=$(dirname "$pom") && cd "$ROOT_DIR/$pom_dir" && CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout) && if echo "$CURRENT_VERSION" | grep -q "-SNAPSHOT"; then BASE_VER=$(echo "$CURRENT_VERSION" | sed 's/-SNAPSHOT//') && NEW_VER="${BASE_VER}-b${{ github.run_number }}-SNAPSHOT"; else NEW_VER="${CURRENT_VERSION}-b${{ github.run_number }}"; fi && mvn versions:set -DnewVersion="$NEW_VER"; done && cd "$ROOT_DIR" && mvn -B clean package

      # -SNAPSHOT の有無で /snapshots と /releases を自動判定してデプロイ
      # - 1 つでもアップロードに失敗したらこのステップを失敗させる
      #   (以前は curl -s だけで、認証エラー(401)や上書き拒否(409)が握りつぶされていた)
      # - Reposilite は同名ファイルの上書きを拒否する (409) ため、
      #   <artifactId>-<baseVersion>-latest.jar は一度削除してから置き直す
      # NOTE: 下の grep -q "-SNAPSHOT" は "-S" がオプション扱いになり常に失敗するため、
      #       (ビルド側のバージョン付与も同様) 現状は SNAPSHOT も含め全て /releases に
      #       <version>-SNAPSHOT-b<N> の形で置かれる。配置先を変えると取得 URL が変わるので、
      #       この修正では既存の挙動をそのまま維持している。
      - name: Deploy Artifacts to Reposilite
        if: github.ref == 'refs/heads/main'
        env:
          REPO_USER: ${{ secrets.REPOSILITE_USER }}
          REPO_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
          REPO_BASE_URL: "https://reposilite.clusters-prj.com" # 末尾のリポジトリ名は除いたベースURL
        run: |
          set -euo pipefail
          ROOT_DIR=$(pwd)
          DEPLOYED=0

          # HTTP ステータスコードだけを返す (接続できない場合は 000)
          http_code() { curl -s -o /dev/null -w '%{http_code}' -u "$REPO_USER:$REPO_TOKEN" "$@"; }

          # upload <ローカルファイル> <URL> [409 を許容するなら allow-conflict]
          upload() {
            local code
            code=$(http_code -X PUT "$2" --upload-file "$1")
            case "$code" in
              2??) return 0 ;;
              409)
                if [ "${3:-}" = "allow-conflict" ]; then
                  echo "::warning::$2 は既に存在します (同じビルドの再実行?)。スキップします"
                  return 0
                fi ;;
            esac
            echo "::error::アップロードに失敗しました: PUT $2 (HTTP $code)"
            return 1
          }

          mapfile -t POMS < <(find . -mindepth 2 -name pom.xml)
          for pom in "${POMS[@]}"; do
            pom_dir=$(dirname "$pom")
            cd "$ROOT_DIR/$pom_dir"
            ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
            FULL_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

            if echo "$FULL_VERSION" | grep -q "-SNAPSHOT"; then
              REPO_TYPE="snapshots"
              BASE_VERSION=$(echo "$FULL_VERSION" | sed -E 's/-b[0-9]+-SNAPSHOT/-SNAPSHOT/')
            else
              REPO_TYPE="releases"
              BASE_VERSION=$(echo "$FULL_VERSION" | sed -E 's/-b[0-9]+$//')
            fi

            JAR_FILE="target/${ARTIFACT_ID}-${FULL_VERSION}.jar"
            if [ ! -f "$JAR_FILE" ]; then
              echo "::warning::$pom_dir: $JAR_FILE が無いためスキップします"
              continue
            fi

            BASE_URL="$REPO_BASE_URL/$REPO_TYPE/$ARTIFACT_ID/$BASE_VERSION"
            LATEST_URL="$BASE_URL/${ARTIFACT_ID}-${BASE_VERSION}-latest.jar"

            echo "Uploading $JAR_FILE to $REPO_TYPE/$ARTIFACT_ID/$BASE_VERSION/ ..."
            upload "$JAR_FILE" "$BASE_URL/${ARTIFACT_ID}-${FULL_VERSION}.jar" allow-conflict

            # -latest.jar は先に削除する (まだ無い場合の 404 は問題ない)
            code=$(http_code -X DELETE "$LATEST_URL")
            case "$code" in
              2??|404) ;;
              *) echo "::error::-latest.jar の削除に失敗しました: DELETE $LATEST_URL (HTTP $code)"; exit 1 ;;
            esac
            upload "$JAR_FILE" "$LATEST_URL"

            # 反映されたことを確認する
            code=$(http_code "$LATEST_URL")
            if [ "$code" != "200" ]; then
              echo "::error::アップロード後に $LATEST_URL を取得できません (HTTP $code)"
              exit 1
            fi
            echo "Deployed: $LATEST_URL"
            DEPLOYED=$((DEPLOYED + 1))
          done

          if [ "$DEPLOYED" -eq 0 ]; then
            echo "::error::デプロイされた jar が 1 つもありません"
            exit 1
          fi
