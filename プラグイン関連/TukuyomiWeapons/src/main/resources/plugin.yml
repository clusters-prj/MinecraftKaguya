name: TukuyomiWeapons
version: ${project.version}
main: trigger.tukuyomiWeapons.TukuyomiWeapons
api-version: "26.2"
commands:
  weapon:
    description: カスタム武器を入手します
    usage: /weapon <武器ID> [プレイヤー]
    permission: weapons.give
  ultcharge:
    description: ウルトのチャージを増やします(動作確認用・コンソール専用)
    usage: /ultcharge <プレイヤー> [%]
    permission: weapons.ultcharge
permissions:
  weapons.ultcharge:
    description: ウルトのチャージを加算する権限(コンソール専用・通常は誰にも付けない)
    default: op
  weapons.give:
    description: 武器を入手する権限
    default: op
