# サーバー識別設定
server-id: "server1"

# データベース接続設定
database:
  host: "10.2.0.1"
  port: 3306
  database: "minecraft_network"
  username: "wg_automator"
  password: "secure_password_here"
  # HikariCPの設定
  maximum-pool-size: 5
  minimum-idle: 2
  connection-timeout: 10000
  idle-timeout: 600000
  max-lifetime: 1800000

# システム設定
settings:
  check-interval-ticks: 200
  max-requests-per-tick: 5
  enable-overlap-check: true

# デフォルトフラグ
default-flags:
  pvp: "DENY"
  tnt: "DENY"
  fire-spread: "DENY"